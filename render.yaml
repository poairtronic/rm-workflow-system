databases:
  - name: v-smart-postgres
    databaseName: v_smart_db
    user: v_smart_admin
    plan: free

services:
  # 1. Backend Web Service (NestJS API Engine)
  - type: web
    name: v-smart-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TYPEORM_SYNC
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: v-smart-postgres
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://v-smart-frontend.onrender.com
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER_EMAIL
        value: posuppportairtronic@gmail.com

  # 2. Frontend Static Site (React 19 / Vite SPA)
  - type: web
    name: v-smart-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=optional && npm install @rolldown/binding-linux-x64-gnu && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://v-smart-backend.onrender.com/api
