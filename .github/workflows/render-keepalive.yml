name: Render Backend Shift-Hour Keep-Alive

on:
  schedule:
    # Runs every 5 minutes during factory working hours (02:00 UTC - 16:00 UTC / 07:30 AM - 09:30 PM IST), Mon-Sat
    - cron: '*/5 2-16 * * 1-6'
  workflow_dispatch:

jobs:
  ping-health:
    name: Ping /health
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Service
        run: |
          TARGET_URL="https://v-smart-backend.onrender.com/health"
          echo "Pinging $TARGET_URL at $(date -u)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$TARGET_URL" || echo "TIMEOUT")
          echo "Health check response: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Warning: Backend returned status $HTTP_STATUS"
          fi
