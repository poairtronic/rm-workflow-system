$kind: http-request
name: 'Update Product'
method: PATCH
url: '{{base_url}}/api/products/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{product_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Product Name",
      "description": "Updated description"
    }
