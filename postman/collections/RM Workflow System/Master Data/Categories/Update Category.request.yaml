$kind: http-request
name: 'Update Category'
method: PATCH
url: '{{base_url}}/api/categories/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{category_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Category",
      "description": "Updated description"
    }
