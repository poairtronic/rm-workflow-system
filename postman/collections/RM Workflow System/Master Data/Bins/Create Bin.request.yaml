$kind: http-request
name: 'Create Bin'
method: POST
url: '{{base_url}}/api/bins'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "POSTMAN_TEST_BIN_001",
      "code": "PTB001",
      "rackId": "{{rack_id}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (pm.response.code === 201 && res.id) {
        pm.environment.set('bin_id', res.id);
      }
      pm.test('Create bin returns 201', () => pm.response.to.have.status(201));
      pm.test('Response has id', () => pm.expect(res).to.have.property('id'));
