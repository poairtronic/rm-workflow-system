$kind: http-request
name: 'Update Family'
method: PATCH
url: '{{base_url}}/api/families/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{family_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Family",
      "description": "Updated description"
    }
