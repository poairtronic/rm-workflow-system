$kind: http-request
name: 'Create Family'
method: POST
url: '{{base_url}}/api/families'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "POSTMAN_TEST_FAMILY_001",
      "categoryId": "{{category_id}}",
      "description": "Test family created by Postman"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (pm.response.code === 201 && res.id) {
        pm.environment.set('family_id', res.id);
      }
      pm.test('Create family returns 201', () => pm.response.to.have.status(201));
      pm.test('Response has id', () => pm.expect(res).to.have.property('id'));
