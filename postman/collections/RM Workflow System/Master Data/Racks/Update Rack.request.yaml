$kind: http-request
name: 'Update Rack'
method: PATCH
url: '{{base_url}}/api/racks/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{rack_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Rack",
      "description": "Updated description"
    }
