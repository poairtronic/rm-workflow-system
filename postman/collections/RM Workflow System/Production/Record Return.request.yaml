$kind: http-request
name: 'Record Return'
method: POST
url: '{{base_url}}/api/production/return'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "scId": "{{sc_id}}",
      "items": [
        {
          "inventoryItemId": "{{inventory_item_id}}",
          "quantity": 2
        }
      ],
      "notes": "Returning unused material"
    }
